        article a {

            font-size: 15px;
        }

        article a:hover {

        }

        footer {
            text-align: center;
            padding: 60px 20px;
            font-size: 13px;
            color: #999;
        }

        /* ---------- 画廊弹窗样式 ---------- */
/* ---------- 画廊弹窗样式（适配手机屏幕） ---------- */
        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            flex-direction: column;
        }
        
        .gallery-modal.active {
            display: flex;
        }
        
        .gallery-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 36px;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
            line-height: 1;
        }
        
        /* 图片显示区域，可上下滚动 */
        .gallery-image-wrapper {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-overflow-scrolling: touch;
        }
        
        .gallery-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: auto; /* 保证图片本身可点击拖动等 */
        }
        
        /* 左右切换按钮容器 */
        .gallery-nav {
            display: flex;
            justify-content: center;
            gap: 50px;
            padding: 15px 0 25px;
        }
        
        .gallery-nav button {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            line-height: 48px;
            text-align: center;
            transition: background 0.2s;
        }
        
        .gallery-nav button:hover {
            background: rgba(255,255,255,0.5);
        }
    </style>
</head>

<body>

<!-- 图片画廊弹窗（优化版） -->
<div id="gallery-modal" class="gallery-modal">
    <button class="gallery-close">&times;</button>
    <div class="gallery-image-wrapper" id="gallery-image-wrapper">
        <img id="gallery-current-image" src="" alt="作品截图">
    </div>
    <div class="gallery-nav">
        <button id="gallery-prev">❮</button>
        <button id="gallery-next">❯</button>
    </div>

<script>
    // 画廊逻辑
// 画廊逻辑（适配手机屏幕）
const modal = document.getElementById('gallery-modal');
const currentImg = document.getElementById('gallery-current-image');
const prevBtn = document.getElementById('gallery-prev');
const nextBtn = document.getElementById('gallery-next');
const closeBtn = document.querySelector('.gallery-close');
const imageWrapper = document.getElementById('gallery-image-wrapper');

let images = [];
let currentIndex = 0;

// 打开画廊
document.querySelectorAll('.gallery-trigger').forEach(link => {
    link.addEventListener('click', function(e) {
        e.preventDefault();
        const imagesStr = this.getAttribute('data-images');
        if (!imagesStr) return;
        images = imagesStr.split(',').map(s => s.trim());
        currentIndex = 0;
        updateImage();
        modal.classList.add('active');
    });
});

// 更新显示的图片
function updateImage() {
    if (images.length === 0) return;
    currentImg.src = images[currentIndex];
    currentImg.alt = `图片 ${currentIndex + 1}`;
    // 每次切换图片后，滚动回到顶部（长图从最上面开始显示）
    imageWrapper.scrollTop = 0;
}

// 关闭画廊
function closeGallery() {
    modal.classList.remove('active');
}
closeBtn.addEventListener('click', closeGallery);
modal.addEventListener('click', function(e) {
    if (e.target === modal) closeGallery();
});

// 左右切换
prevBtn.addEventListener('click', () => {
    if (images.length === 0) return;
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage();
});
nextBtn.addEventListener('click', () => {
    if (images.length === 0) return;
    currentIndex = (currentIndex + 1) % images.length;
    updateImage();
});

// 键盘控制
document.addEventListener('keydown', function(e) {
    if (!modal.classList.contains('active')) return;
    if (e.key === 'ArrowLeft') prevBtn.click();
    if (e.key === 'ArrowRight') nextBtn.click();
    if (e.key === 'Escape') closeGallery();
});
</script>
